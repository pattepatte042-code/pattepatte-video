name: Reel anime
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Identifiant"
        required: true
      spec:
        description: "JSON du Reel (theme, categorie, slides)"
        required: true
      image_url:
        description: "Photo de fond"
        required: false
        default: ""
      video_urls:
        description: "Clips video de fond (Pixabay), separes par des espaces"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: rendu-video
  cancel-in-progress: false
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Installer les outils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-numpy python3-pil fonts-dejavu-core fonts-noto-color-emoji
      - name: Fabriquer
        env:
          JOB_ID: ${{ inputs.job_id }}
          SPEC: ${{ inputs.spec }}
          IMAGE_URL: ${{ inputs.image_url }}
          VIDEO_URLS: ${{ inputs.video_urls }}
        run: bash reel.sh
      - name: Publier (release "videos")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view videos >/dev/null 2>&1 || gh release create videos --title "Videos Patte a Patte" --notes "Videos generees automatiquement (Reels)."
          for f in videos/*; do gh release upload videos "$f" --clobber; done
