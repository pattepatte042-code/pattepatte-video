name: Photo annotee
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Identifiant"
        required: true
      image_url:
        description: "Photo source"
        required: true
      mode:
        description: "grille, final ou tiers"
        required: true
        default: "grille"
      titre:
        description: "Titre court"
        required: false
        default: ""
      annotations:
        description: "JSON des annotations"
        required: false
        default: "[]"
      pattes:
        description: "JSON des points de contact (style tiers)"
        required: false
        default: "[]"
permissions:
  contents: write
concurrency:
  group: rendu-video
  cancel-in-progress: false
jobs:
  annoter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installer les outils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-numpy python3-pil fonts-dejavu-core
      - name: Fabriquer
        env:
          JOB_ID: ${{ inputs.job_id }}
          IMAGE_URL: ${{ inputs.image_url }}
          MODE: ${{ inputs.mode }}
          TITRE: ${{ inputs.titre }}
          ANNOTATIONS: ${{ inputs.annotations }}
          PATTES: ${{ inputs.pattes }}
        run: bash annotate.sh
      - name: Publier (release "videos")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view videos >/dev/null 2>&1 || gh release create videos --title "Videos Patte a Patte" --notes "Videos generees automatiquement (Reels)."
          for f in videos/*; do gh release upload videos "$f" --clobber; done
